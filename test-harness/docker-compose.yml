services:
  harness:
    build:
      context: .
    image: agent-standards-harness:local
    init: true
    environment:
      AGENT_STANDARDS_REPO: /repo
      HARNESS_PROJECT: /work/project
      HARNESS_CLI_TIMEOUT: "300"
    volumes:
      - type: bind
        source: ..
        target: /repo
        read_only: true
    command: ["/harness/verify.sh"]
