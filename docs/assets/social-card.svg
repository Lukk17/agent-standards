<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="1" stop-color="#2b1b4d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="10" fill="#7c3aed"/>
  <text x="80" y="150" fill="#ffffff" font-size="84" font-weight="700">Agent Standards</text>
  <text x="80" y="240" fill="#c9b8ef" font-size="36" font-weight="400">One git checkout drops a shared AI coding setup</text>
  <text x="80" y="292" fill="#c9b8ef" font-size="36" font-weight="400">into any project, across five agents.</text>
  <g font-size="30" font-weight="600">
    <rect x="80" y="360" width="250" height="64" rx="12" fill="#2b1b4d" stroke="#7c3aed" stroke-width="2"/>
    <text x="205" y="401" fill="#ffffff" text-anchor="middle">84 skills</text>
    <rect x="350" y="360" width="290" height="64" rx="12" fill="#2b1b4d" stroke="#7c3aed" stroke-width="2"/>
    <text x="495" y="401" fill="#ffffff" text-anchor="middle">30 subagents</text>
    <rect x="660" y="360" width="290" height="64" rx="12" fill="#2b1b4d" stroke="#7c3aed" stroke-width="2"/>
    <text x="805" y="401" fill="#ffffff" text-anchor="middle">8 MCP servers</text>
  </g>
  <text x="80" y="520" fill="#ffffff" font-size="30" font-weight="500">Claude Code  .  Kilo  .  OpenCode  .  Codex  .  GitHub Copilot</text>
  <text x="80" y="580" fill="#8a7bb8" font-size="26" font-weight="400">github.com/Lukk17/agent-standards  .  MIT</text>
</svg>
