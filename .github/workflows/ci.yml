name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run actionlint on workflow YAML
        uses: reviewdog/action-actionlint@be0761e4c1bab7cfdfca56cd03d4bb6253e39a4a # v1.72.0
        with:
          fail_on_error: true
          reporter: local

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Pin pip to a version that supports dependency groups
        run: python -m pip install --upgrade "pip==26.2.1"

      - name: Install the pinned generator and test dependencies
        run: pip install ./tools --group ./tools/pyproject.toml:dev

      - name: Validate JSON config and hook files
        run: python -c "import json; [json.load(open(f)) for f in ['.mcp.json','opencode.json','.vscode/mcp.json','.claude/settings.json','.github/hooks/preflight.json']]"

      - name: Validate the Codex TOML config
        run: python -c "import tomllib; tomllib.load(open('.codex/config.toml','rb'))"

      - name: Check subagent generator output is in sync with canonical sources
        run: python tools/gen_subagents.py --check

      - name: Lint human-facing markdown (em-dashes, line widths)
        run: python tools/check-markdown.py

      - name: Run the hook and tooling test suite
        working-directory: tools
        run: python -m pytest

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Put the commit under test on a master branch the import can read
        run: git switch --force-create master

      - name: Build the sandbox image once for every scenario below
        working-directory: sandbox-agent
        run: docker compose build

      - name: Assert what each agent discovers in an imported project
        working-directory: sandbox-agent
        run: docker compose run --rm -T -e SANDBOX_SKIP_UPDATE=1 sandbox

      - name: Assert what the global install lands in the container home
        working-directory: sandbox-agent
        run: docker compose run --rm -T -e SANDBOX_SKIP_UPDATE=1 sandbox /sandbox/verify-global.sh

      - name: Assert a scoped global install writes only the named agent's paths
        working-directory: sandbox-agent
        run: docker compose run --rm -T -e SANDBOX_SKIP_UPDATE=1 sandbox /sandbox/verify-global.sh --scoped codex
