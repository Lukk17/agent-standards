name: CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run actionlint on workflow YAML
        uses: reviewdog/action-actionlint@be0761e4c1bab7cfdfca56cd03d4bb6253e39a4a # v1.72.0
        with:
          fail_on_error: true
          reporter: github-check

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Install generator dependencies
        run: pip install ./tools

      - name: Validate JSON example files
        run: |
          python -c "import json; json.load(open('.mcp.json.example'))"
          python -c "import json; json.load(open('opencode.json.example'))"

      - name: Check subagent generator output is in sync with canonical sources
        run: python tools/gen-subagents.py --check

      - name: Lint human-facing markdown (em-dashes, line widths)
        run: python tools/check-markdown.py
