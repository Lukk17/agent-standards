name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create (e.g. v0.1.0). Must match SemVer."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout master with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Validate version format (SemVer with required v-prefix)
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'; then
            echo "::error::Version '$VERSION' is not valid SemVer with required v-prefix."
            exit 1
          fi

      - name: Reject duplicate tag
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      - name: Reject non-monotonic version
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$PREV" ]; then
            echo "No prior tags; '$VERSION' will be the first release."
            exit 0
          fi
          LATEST=$(printf '%s\n%s\n' "$PREV" "$VERSION" | sort -V | tail -n 1)
          if [ "$LATEST" != "$VERSION" ] || [ "$PREV" = "$VERSION" ]; then
            echo "::error::Version '$VERSION' is not greater than the previous tag '$PREV'."
            exit 1
          fi
          echo "Previous tag: $PREV. New: $VERSION."

      - name: Create GitHub release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --target master --title "$VERSION" --generate-notes
