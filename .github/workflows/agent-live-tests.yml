name: Agent live tests

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent to test against the real model
        required: true
        default: all
        type: choice
        options:
          - claude-code
          - codex
          - opencode
          - kilo-code
          - copilot
          - all

permissions:
  contents: read

concurrency:
  group: agent-live-tests-${{ github.ref }}-${{ inputs.agent }}
  cancel-in-progress: false

jobs:
  live:
    name: live (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(inputs.agent == 'all' && '["claude-code","codex","opencode","kilo-code","copilot"]' || format('["{0}"]', inputs.agent)) }}
    env:
      LIVE_KEY_NAME: ${{ contains(fromJSON('["codex","copilot"]'), matrix.agent) && 'OPENAI_API_KEY' || 'REQUESTY_API_KEY' }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the key, the balance and the model with the provider
        env:
          REQUESTY_API_KEY: ${{ env.LIVE_KEY_NAME == 'REQUESTY_API_KEY' && secrets.REQUESTY_API_KEY || '' }}
          OPENAI_API_KEY: ${{ env.LIVE_KEY_NAME == 'OPENAI_API_KEY' && secrets.OPENAI_API_KEY || '' }}
        run: bash sandbox-agent/live/${{ matrix.agent }}.sh health

      - name: Put the commit under test on a master branch the import can read
        run: git switch --force-create master

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run the agent against the real model
        env:
          REQUESTY_API_KEY: ${{ env.LIVE_KEY_NAME == 'REQUESTY_API_KEY' && secrets.REQUESTY_API_KEY || '' }}
          OPENAI_API_KEY: ${{ env.LIVE_KEY_NAME == 'OPENAI_API_KEY' && secrets.OPENAI_API_KEY || '' }}
          LIVE_WORK: ${{ runner.temp }}/live-${{ matrix.agent }}
          LIVE_INSTALL: "1"
        run: bash sandbox-agent/live/${{ matrix.agent }}.sh run

      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-${{ matrix.agent }}-transcripts
          path: ${{ runner.temp }}/live-${{ matrix.agent }}/cases
          if-no-files-found: ignore
          retention-days: 14
