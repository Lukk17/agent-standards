name: Plugins

# Checks the Claude Code marketplace committed at .claude-plugin/marketplace.json
# and tags each plugin version once it lands on master. Every skill, subagent,
# hook and MCP server is its own plugin there, and CI's validate job already
# fails a stale marketplace and a changed plugin that kept its version.
#
# validate runs the pinned Claude Code validator on the marketplace. install
# serves the repository over smart HTTP and installs single plugins and a
# bundle with the same pinned release, checking what lands in the plugin cache.
# On a push to master only, after both, tag-plan lists every plugin version
# with no <name>--v<version> tag yet, read-only and with no package installed,
# and tag creates those tags at the tested commit and pushes them. The default
# token reaches the push step alone, and no checkout keeps credentials.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# A pull request keeps one run, the newest. Every push to master gets its own
# group, by commit, and is never cancelled, so each tagging run finishes.
concurrency:
  group: plugins-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLAUDE_CODE_VERSION: "2.1.323"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the marketplace, warnings as errors
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          CLAUDE_CONFIG_DIR="$(mktemp -d)"
          export CLAUDE_CONFIG_DIR
          claude --version
          claude plugin validate . --strict

  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Pin pip to a version that supports dependency groups
        run: python -m pip install --upgrade "pip==26.2.1"

      - name: Install the pinned tooling and test dependencies
        run: pip install ./tools --group ./tools/pyproject.toml:dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Install single plugins and a bundle from the served marketplace
        working-directory: tools
        env:
          AGENT_STANDARDS_INSTALL_TEST: "1"
        run: |
          claude --version
          python -m pytest tests/test_marketplace_install.py -v

  tag-plan:
    needs: [validate, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - name: Checkout with every tag, keeping no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: List every plugin version that has no tag yet
        id: plan
        run: |
          set -euo pipefail
          tags="$(python3 tools/plugin_tags.py | tr '\n' ' ')"
          echo "tags=${tags% }" >> "$GITHUB_OUTPUT"
          echo "New plugin tags at ${GITHUB_SHA}: ${tags:-none}"

  tag:
    needs: tag-plan
    if: needs.tag-plan.outputs.tags != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the tested commit, keeping no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create each planned tag at the tested commit
        env:
          TAGS: ${{ needs.tag-plan.outputs.tags }}
        run: |
          set -euo pipefail
          set -f
          pattern='^[a-z0-9]+(-[a-z0-9]+)*--v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
          for tag in $TAGS; do
            if [[ ! "$tag" =~ $pattern ]]; then
              echo "::error::refusing to create the tag ${tag}, which is not <name>--v<version>"
              exit 1
            fi
            git tag "$tag" "$GITHUB_SHA"
          done

      - name: Push the new tags, the only step that holds the token
        env:
          TAGS: ${{ needs.tag-plan.outputs.tags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -f
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          refs=()
          for tag in $TAGS; do
            refs+=("refs/tags/${tag}")
          done
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --atomic origin "${refs[@]}"
          echo "Pushed ${#refs[@]} plugin tags at ${GITHUB_SHA}."
