name: Plugins

# Checks the Claude Code marketplace committed at .claude-plugin/marketplace.json
# and tags each plugin version once it lands on master. Every skill, subagent,
# hook and MCP server is its own plugin there, and CI's validate job already
# fails a stale marketplace and a changed plugin that kept its version.
#
# validate runs the pinned Claude Code validator on the marketplace. install
# serves the repository over smart HTTP and installs single plugins and a
# bundle with the same pinned release, checking what lands in the plugin cache.
# tag runs only on a push to master, after both, and pushes a
# <name>--v<version> tag for every plugin version that has none yet, with the
# default token.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# A pull request keeps one run, the newest. Every push to master gets its own
# group, by commit, and is never cancelled, so each tagging run finishes.
concurrency:
  group: plugins-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLAUDE_CODE_VERSION: "2.1.323"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the marketplace, warnings as errors
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          CLAUDE_CONFIG_DIR="$(mktemp -d)"
          export CLAUDE_CONFIG_DIR
          claude --version
          claude plugin validate . --strict

  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Pin pip to a version that supports dependency groups
        run: python -m pip install --upgrade "pip==26.2.1"

      - name: Install the pinned tooling and test dependencies
        run: pip install ./tools --group ./tools/pyproject.toml:dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Install single plugins and a bundle from the served marketplace
        working-directory: tools
        env:
          AGENT_STANDARDS_INSTALL_TEST: "1"
        run: |
          claude --version
          python -m pytest tests/test_marketplace_install.py -v

  tag:
    needs: [validate, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout with every tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Pin pip to a version that supports dependency groups
        run: python -m pip install --upgrade "pip==26.2.1"

      - name: Install the pinned tooling
        run: pip install ./tools

      - name: Check the marketplace being tagged matches its sources
        run: python tools/gen_plugins.py --check

      - name: Tag every plugin version that has no tag yet and push the new tags
        run: |
          set -euo pipefail
          python tools/plugin_tags.py > "${RUNNER_TEMP}/new-tags.txt"
          if [ ! -s "${RUNNER_TEMP}/new-tags.txt" ]; then
            echo "Every plugin version at ${GITHUB_SHA} is already tagged."
            exit 0
          fi
          while IFS= read -r tag; do
            git tag "$tag" "$GITHUB_SHA"
          done < "${RUNNER_TEMP}/new-tags.txt"
          sed 's#^#refs/tags/#' "${RUNNER_TEMP}/new-tags.txt" | xargs git push --atomic origin
          echo "Pushed $(wc -l < "${RUNNER_TEMP}/new-tags.txt") plugin tags at ${GITHUB_SHA}."
