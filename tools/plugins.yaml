# Plugin map for the Claude Code marketplace in .claude-plugin/marketplace.json.
# tools/gen_plugins.py renders it on master, and CI fails when the committed
# file is stale. Every skill, every subagent, every Claude Code hook and every
# MCP server is its own plugin with its own version, and the bundles below
# group them by listing plugin names as dependencies, with no files of their own.
#
# Where each item's version lives:
# - a skill in its SKILL.md front matter as metadata.version
# - a subagent in its canonical subagents/<name>.md front matter as version
# - a hook, a server and a bundle here, as version
# Any change to an item raises its version: patch for a fix, minor for new
# behaviour, major for a breaking change. tools/check_versions.py fails a pull
# request that changes an item without raising it.
#
# check_map in tools/plugin_map_rules.py refuses a map that breaks one of these
# rules, which tools/tests/test_gen_plugins.py proves case by case:
#
# - Every skill under .agents/skills/ and every subagent under subagents/ sits
#   in exactly one development or host bundle, and every name is kebab-case and
#   unique across all plugins.
# - core holds exactly the skills that subagents in two or more bundles
#   preload, and no subagent and no dependency.
# - Every other skill a subagent preloads sits in that subagent's own bundle,
#   and a bundle whose subagents preload a core skill depends on core.
# - Every hook script the Claude Code wiring in .claude/settings.json runs has
#   exactly one hook entry, named for its folder under .agents/hooks/, and
#   every hook entry is wired there.
# - Every server in the root .mcp.json has exactly one server entry.
# - The bundle category is development, host or bundle. mcp-all depends on
#   every server plugin, hooks-all on every hook plugin, and all installs core
#   and every development bundle, nothing else.
#
# Which bundle a subagent or an unpreloaded skill belongs to is a convention
# the tests cannot check. CONTRIBUTING.md describes it.

marketplace:
  name: agent-standards
  description: Every skill, subagent, Claude Code hook and MCP server from agent-standards as its own versioned plugin, with bundles that group them by domain.
  owner:
    name: Łukasz Sarna
    url: https://github.com/Lukk17
  repository: https://github.com/Lukk17/agent-standards
  license: MIT

hooks:
  - name: preflight-gate
    version: 1.0.0
    description: The preflight gate on PreToolUse. The main thread may not write project files, run scripts or browse, and a subagent with no skills or a read-only one is held to its definition.

  - name: task-list-sync
    version: 1.0.0
    description: Mirrors the session task list into tasks.md at the project root, puts it back in context after a compaction, and stops a turn that leaves tasks open.

  - name: no-ai-markers-check
    version: 1.0.0
    description: Checks a finished reply for em dashes, en dashes and other machine-writing markers, and shows the corrected text.

  - name: markdown-lint-check
    version: 1.0.0
    description: Lints a markdown file in the lint scope right after an edit and hands the violations back to the model.

  - name: standards-advisory-check
    folder: claude/standards-advisory-check
    version: 1.0.0
    description: Warns after an edit about an action on a moving tag, an image on latest, a JPA query string or a divider banner in a test.

  - name: preflight-reminder
    folder: claude/preflight-reminder
    version: 1.0.0
    description: The PREFLIGHT reminder at session start and on every prompt, naming the owning skills and subagents first and ending each reply with the status block.

  - name: background-subagent-reminder
    folder: claude/background-subagent-reminder
    version: 1.0.0
    description: The session-start note to check a background subagent every 10 minutes against how long its task should take.

  - name: subagent-reminder
    folder: claude/subagent-reminder
    version: 1.0.0
    description: The reminder a subagent gets when it starts, that it does the delegated work itself and reports what it changed.

servers:
  - name: context7
    version: 1.0.0
    description: The Context7 documentation MCP server.

  - name: mongodb
    version: 1.0.0
    description: The MongoDB MCP server, read-only, started with npx.

  - name: grafana
    version: 1.0.0
    description: The Grafana MCP server, started with uvx.

  - name: playwright
    version: 1.0.0
    description: The Playwright browser MCP server, started with npx. It can write local files.

  - name: chrome-devtools
    version: 1.0.0
    description: The Chrome DevTools MCP server, started with npx. It can write local files.

  - name: redis
    version: 1.0.0
    description: The Redis MCP server, started with uvx.

  - name: sonarqube
    version: 1.0.0
    description: The SonarQube MCP server, started with docker run, which pulls the image on every start.

  - name: n8n
    version: 1.0.0
    description: The n8n MCP server, started with npx.

  - name: home-assistant
    version: 1.0.0
    description: The Home Assistant MCP server, started with uvx and reading its settings from an env file in your home directory.

bundles:
  - name: core
    version: 1.0.0
    category: development
    description: Skills that subagents in two or more domains preload, such as coding standards, security review, TDD, logging and git practice. Every domain bundle depends on it.
    skills:
      - architecture-decision-records
      - bash
      - build-dependency-management
      - code-formatter
      - coding-standards
      - git-workflow
      - github-ops
      - hexagonal-architecture
      - markdown-writer
      - observability-and-logging
      - performance-optimization
      - python-patterns
      - application-security-review
      - tdd-workflow

  - name: python
    version: 1.0.0
    category: development
    description: Python and machine learning, with the python-pro and ml-engineer subagents and the PyTorch skill.
    dependencies: [core]
    agents: [python-pro, ml-engineer]
    skills: [pytorch-patterns]

  - name: jvm
    version: 1.0.0
    category: development
    description: Java and Spring Boot, with the java-pro subagent and the Java, Spring Boot and SOAP skills.
    dependencies: [core]
    agents: [java-pro]
    skills: [java-coding-standards, springboot-patterns, soap-webservices]

  - name: go
    version: 1.0.0
    category: development
    description: Go services, with the go-pro subagent and the Go patterns skill.
    dependencies: [core]
    agents: [go-pro]
    skills: [golang-patterns]

  - name: backend
    version: 1.0.0
    category: development
    description: Backend services and HTTP APIs, with the backend-architect, api-documenter and api-tester subagents and the API design, backend, Node.js and Keycloak skills.
    dependencies: [core]
    agents: [backend-architect, api-documenter, api-tester]
    skills: [api-design, backend-patterns, node-backend-patterns, keycloak-patterns]

  - name: data
    version: 1.0.0
    category: development
    description: Databases, with the database-expert subagent and the PostgreSQL, migration and MongoDB skills.
    dependencies: [core]
    agents: [database-expert]
    skills: [postgres-patterns, database-migrations, mongodb-patterns]

  - name: web-frontend
    version: 1.0.0
    category: development
    description: Web interfaces, with the Angular, React and Next.js, accessibility, design system and UI subagents and their skills.
    dependencies: [core]
    agents: [angular-expert, react-nextjs-expert, accessibility-expert, design-system-architect, ui-ux-designer]
    skills: [angular, nextjs-app-router-patterns, react-patterns, frontend-design, design-system, web-accessibility]

  - name: mobile
    version: 1.0.0
    category: development
    description: Flutter and Dart apps, with the flutter-expert subagent and the Dart and Flutter skill.
    dependencies: [core]
    agents: [flutter-expert]
    skills: [dart-flutter-patterns]

  - name: devops
    version: 1.0.0
    category: development
    description: Delivery and operations, with the devops, incident, observability and release subagents and the deployment, Docker and Ansible skills.
    dependencies: [core]
    agents: [devops-automator, devops-troubleshooter, error-detective, observability-engineer, release-manager]
    skills: [deployment-patterns, docker-patterns, ansible]

  - name: review-and-security
    version: 1.0.0
    category: development
    description: Code review, security audit, codebase mapping and legacy migration, with four subagents and the review and duplication skills.
    dependencies: [core]
    agents: [code-reviewer, security-auditor, code-archaeologist, legacy-modernizer]
    skills: [code-reviewer, review-duplication]

  - name: testing
    version: 1.0.0
    category: development
    description: Tests, debugging, performance measurement and the quality loop, with five subagents and the regression, end-to-end, Playwright and quality-loop skills. The quality-loop skill carries Robert C. Martin's crapper, dryer and mutator (github.com/unclebob), copied into a project that lacks them.
    dependencies: [core]
    agents: [test-automator, debugger, e2e-runner, performance-engineer, quality-loop]
