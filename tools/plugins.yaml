    skills: [unity]

  - name: agent-tooling
    version: 1.0.0
    category: development
    description: Agent configuration and research, with the agent-engineer subagent and the agentic engineering, research and automation inventory skills.
    dependencies: [core]
    agents: [agent-engineer]
    skills: [agentic-engineering, research, automation-inventory]

  - name: linux
    version: 1.0.0
    category: host
    description: Linux desktop administration on Arch, CachyOS and KDE Plasma.
    skills: [arch-linux, cachyos, kde-plasma]

  - name: windows-and-mac
    version: 1.0.0
    category: host
    description: Windows and macOS administration and PowerShell scripting.
    skills: [windows, macos, powershell]

  - name: homelab
    version: 1.0.0
    category: host
    description: Homelab hosts and services, with the home-assistant-engineer subagent and the Proxmox, router, Syncthing, Samsung TV, WLED and machine health skills.
    dependencies: [core]
    agents: [home-assistant-engineer]
    skills: [home-assistant, proxmox, homelab-services, asus-router, syncthing, samsung-tv, wled, machine-health]

  - name: personal-tools
    version: 1.0.0
    category: host
    description: Obsidian, JetBrains IDE configuration and the self-hosted AscendMemory, ascend-web-hunter and AudioScribe services.
    skills: [obsidian, jetbrains-ide-ops, ascend-memory, ascend-web-hunter, audio-scribe]

  - name: mcp-all
    version: 1.0.0
    category: bundle
    description: Every MCP server plugin in one install.
    dependencies:
      - mcp-context7
      - mcp-mongodb
      - mcp-grafana
      - mcp-playwright
      - mcp-chrome-devtools
      - mcp-redis
      - mcp-sonarqube
      - mcp-n8n
      - mcp-home-assistant

  - name: all
    version: 1.0.0
    category: bundle
    description: Core and every development domain in one install. Host groups and MCP servers stay separate installs.
    dependencies:
      - core
      - python
      - jvm
      - go
      - backend
      - data
      - web-frontend
      - mobile
      - devops
      - review-and-security
      - testing
      - docs-and-product
      - embedded
      - game
      - agent-tooling

  - name: hooks-all
    version: 1.0.0
    category: bundle
    description: Every Claude Code hook plugin in one install.
    dependencies:
      - hook-preflight-gate
      - hook-task-list-sync
      - hook-no-ai-markers-check
      - hook-markdown-lint-check
      - hook-standards-advisory-check
      - hook-preflight-reminder
      - hook-background-subagent-reminder
      - hook-subagent-reminder
