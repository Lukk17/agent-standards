# Plugin map for the Claude Code marketplace in .claude-plugin/marketplace.json.
# tools/gen_plugins.py renders it on master, and CI fails when the committed
# file is stale. Every skill, every subagent, every Claude Code hook and every
# MCP server is its own plugin with its own version, and the bundles below
# group them by listing plugin names as dependencies, with no files of their own.
#
# Where each item's version lives:
# - a skill in its SKILL.md front matter as metadata.version
# - a subagent in its canonical subagents/<name>.md front matter as version
# - a hook, a server and a bundle here, as version
# The marketplace block gives every entry its author (the owner), homepage,
# repository and license, and tools/gen_plugins.py derives the keywords.
# Any change to an item raises its version: patch for a fix, minor for new
# behaviour, major for a breaking change. tools/check_versions.py fails a pull
# request that changes an item without raising it.
#
# check_map in tools/plugin_map_rules.py refuses a map that breaks one of these
# rules, which tools/tests/test_gen_plugins.py proves case by case:
#
# - Every skill under .agents/skills/ and every subagent under subagents/ sits
#   in exactly one development or host bundle, and every name is kebab-case and
#   unique across all plugins.
# - core holds exactly the skills that subagents in two or more bundles
#   preload, and no subagent and no dependency.
# - Every other skill a subagent preloads sits in that subagent's own bundle,
#   and a bundle whose subagents preload a core skill depends on core.
# - Every hook entry is named for its folder under .agents/hooks/ and carries
#   its wiring, the hooks its plugin installs: event, then matcher groups, then
#   command handlers. Each command starts with cd "${CLAUDE_PROJECT_DIR}" and
#   runs exactly one script, which its folder holds, from
#   "${CLAUDE_PLUGIN_ROOT}"/, and names no script by a project path.
# - Every server entry carries its block, the mcpServers entry its plugin
#   installs, and a block that starts a local server names one exact release:
#   no latest, no missing version, no untagged image, no pull on every start.
# - Every server in the root .mcp.json has exactly one server entry, with the
#   same block. A server entry the root file leaves out is a plugin only.
# - The bundle category is development, host or bundle. mcp-all depends on
#   every server plugin, hooks-all on every hook plugin, and all installs core
#   and every development bundle, nothing else.
#
# Which bundle a subagent or an unpreloaded skill belongs to is a convention
# the tests cannot check. CONTRIBUTING.md describes it.

marketplace:
  name: agent-standards
  description: Every skill, subagent, Claude Code hook and MCP server from agent-standards as its own versioned plugin, with bundles that group them by domain.
  owner:
    name: Łukasz Sarna
    url: https://github.com/Lukk17
  repository: https://github.com/Lukk17/agent-standards
  homepage: https://github.com/Lukk17/agent-standards#readme
  license: MIT

hooks:
  - name: preflight-gate
    version: 1.0.1
    description: The preflight gate on PreToolUse. The main thread may not write project files, run scripts or browse, and a subagent with no skills or a read-only one is held to its definition.
    wiring:
      PreToolUse:
        - matcher: "^(Edit|Write|MultiEdit|NotebookEdit|Bash|PowerShell|WebFetch|WebSearch)$"
          hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/preflight_gate.py --format claude ; exit 0'

  - name: task-list-sync
    version: 1.0.1
    description: Mirrors the session task list into tasks.md at the project root, puts it back in context after a compaction, and stops a turn that leaves tasks open.
    wiring:
      SessionStart:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/task_list_sync.py --event sessionstart --format claude ; exit 0'
      PreCompact:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/task_list_sync.py --event precompact --format claude ; exit 0'
      TaskCreated:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/task_list_sync.py --event taskcreated --format claude ; exit 0'
      TaskCompleted:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/task_list_sync.py --event taskcompleted --format claude ; exit 0'
      Stop:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/task_list_sync.py --event stop --format claude ; exit 0'

  - name: no-ai-markers-check
    version: 1.0.1
    description: Checks a finished reply for em dashes, en dashes and other machine-writing markers, and shows the corrected text.
    wiring:
      Stop:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/no_ai_markers_check.py --format claude --display-fixed ; exit 0'
      MessageDisplay:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/no_ai_markers_check.py --format claude --display ; exit 0'

  - name: markdown-lint-check
    version: 1.1.0
    description: Lints a markdown file in the lint scope right after an edit and hands the violations back to the model.
    wiring:
      PostToolUse:
        - matcher: "^(Edit|Write|MultiEdit)$"
          hooks:
            - type: command
              timeout: 15
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/markdown_lint_check.py --format claude ; exit 0'

  - name: standards-advisory-check
    folder: claude/standards-advisory-check
    version: 1.0.1
    description: Warns after an edit about an action on a moving tag, an image on latest, a JPA query string or a divider banner in a test.
    wiring:
      PostToolUse:
        - matcher: "^(Edit|Write|MultiEdit)$"
          hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/standards_advisory_check.py --format claude ; exit 0'

  - name: preflight-reminder
    folder: claude/preflight-reminder
    version: 1.0.1
    description: The PREFLIGHT reminder at session start and on every prompt, naming the owning skills and subagents first and ending each reply with the status block.
    wiring:
      SessionStart:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/preflight_reminder.py ; exit 0'
      UserPromptSubmit:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/preflight_reminder.py ; exit 0'

  - name: background-subagent-reminder
    folder: claude/background-subagent-reminder
    version: 1.0.1
    description: The session-start note to check a background subagent every 10 minutes against how long its task should take.
    wiring:
      SessionStart:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/background_subagent_reminder.py ; exit 0'

  - name: subagent-reminder
    folder: claude/subagent-reminder
    version: 1.0.1
    description: The reminder a subagent gets when it starts, that it does the delegated work itself and reports what it changed.
    wiring:
      SubagentStart:
        - hooks:
            - type: command
              timeout: 10
              command: 'cd "${CLAUDE_PROJECT_DIR}" && PY=$(command -v python3 || command -v python) && "$PY" -S -E "${CLAUDE_PLUGIN_ROOT}"/subagent_reminder.py ; exit 0'

servers:
  - name: context7
    version: 1.0.1
    description: The Context7 documentation MCP server.
    block:
      type: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"

  - name: mongodb
    version: 1.1.0
    description: The MongoDB MCP server, read-only, started with npx.
    block:
      type: stdio
      command: npx
      args:
        - "-y"
        - "mongodb-mcp-server@3.3.0"
        - "--readOnly"
        - "--connectionString"
        - "${MONGODB_URL:-mongodb://localhost:27017}"

  - name: grafana
    version: 1.1.0
    description: The Grafana MCP server, started with uvx.
    block:
      type: stdio
      command: uvx
      args:
        - "mcp-grafana==2.2.0"
      env:
        GRAFANA_URL: "${GRAFANA_URL:-http://localhost:3000}"
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}"

  - name: playwright
    version: 1.1.0
    description: The Playwright browser MCP server, started with npx. It can write local files.
    block:
      type: stdio
      command: npx
      args:
        - "@playwright/mcp@0.0.85"

  - name: chrome-devtools
    version: 1.1.0
    description: The Chrome DevTools MCP server, started with npx. It can write local files.
    block:
      type: stdio
      command: npx
      args:
        - "-y"
        - "chrome-devtools-mcp@1.13.0"

  - name: redis
    version: 1.1.0
    description: The Redis MCP server, started with uvx.
    block:
      type: stdio
      command: uvx
      args:
        - "--from"
        - "redis-mcp-server==0.5.1"
        - "redis-mcp-server"
        - "--url"
        - "${REDIS_URL:-redis://localhost:6379/0}"

  - name: sonarqube
    version: 2.0.0
    description: The SonarQube MCP server, started with docker run from SonarSource's own image pinned to a version tag.
    block:
      type: stdio
      command: docker
      args:
        - "run"
        - "--init"
        - "-i"
        - "--rm"
        - "-e"
        - "SONARQUBE_TOKEN"
        - "-e"
        - "SONARQUBE_URL"
        - "sonarsource/sonarqube-mcp:1.32.0.5118"
      env:
        SONARQUBE_TOKEN: "${SONARQUBE_TOKEN:-}"
        SONARQUBE_URL: "${SONARQUBE_URL:-http://localhost:9000}"

  - name: n8n
    version: 1.1.0
    description: The n8n MCP server, started with npx.
    block:
      type: stdio
      command: npx
      args:
        - "n8n-mcp@2.102.0"
      env:
        N8N_API_URL: "${N8N_API_URL:-http://localhost:5678}"
        N8N_API_KEY: "${N8N_API_KEY:-}"

  - name: home-assistant
    version: 2.0.0
    description: The Home Assistant MCP server, started with uvx and reading its settings from an env file in your home directory.
    block:
      type: stdio
      command: uvx
      args:
        - "--env-file"
        - "${HOME}/.local/state/agents/workspace/homelab.env"
        - "ha-mcp==9.2.0"

bundles:
  - name: core
    version: 1.0.1
    category: development
    description: Skills that subagents in two or more domains preload, such as coding standards, security review, TDD, logging and git practice. Every domain bundle depends on it.
    skills:
      - architecture-decision-records
      - bash
      - build-dependency-management
      - code-formatter
      - coding-standards
      - git-workflow
      - github-ops
      - hexagonal-architecture
      - markdown-writer
      - observability-and-logging
      - performance-optimization
      - python-patterns
      - application-security-review
      - tdd-workflow

  - name: python
    version: 1.0.1
    category: development
    description: Python and machine learning, with the python-pro and ml-engineer subagents and the PyTorch skill.
    dependencies: [core]
    agents: [python-pro, ml-engineer]
    skills: [pytorch-patterns]

  - name: jvm
    version: 1.0.1
    category: development
    description: Java and Spring Boot, with the java-pro subagent and the Java, Spring Boot and SOAP skills.
    dependencies: [core]
    agents: [java-pro]
    skills: [java-coding-standards, springboot-patterns, soap-webservices]

  - name: go
    version: 1.0.1
    category: development
    description: Go services, with the go-pro subagent and the Go patterns skill.
    dependencies: [core]
    agents: [go-pro]
    skills: [golang-patterns]

  - name: backend
    version: 1.0.1
    category: development
    description: Backend services and HTTP APIs, with the backend-architect, api-documenter and api-tester subagents and the API design, backend, Node.js and Keycloak skills.
    dependencies: [core]
    agents: [backend-architect, api-documenter, api-tester]
    skills: [api-design, backend-patterns, node-backend-patterns, keycloak-patterns]

  - name: data
    version: 1.0.1
    category: development
    description: Databases, with the database-expert subagent and the PostgreSQL, migration and MongoDB skills.
    dependencies: [core]
    agents: [database-expert]
    skills: [postgres-patterns, database-migrations, mongodb-patterns]

  - name: web-frontend
    version: 1.0.1
    category: development
    description: Web interfaces, with the Angular, React and Next.js, accessibility, design system and UI subagents and their skills.
    dependencies: [core]
    agents: [angular-expert, react-nextjs-expert, accessibility-expert, design-system-architect, ui-ux-designer]
    skills: [angular, nextjs-app-router-patterns, react-patterns, frontend-design, design-system, web-accessibility]

  - name: mobile
    version: 1.0.1
    category: development
    description: Flutter and Dart apps, with the flutter-expert subagent and the Dart and Flutter skill.
    dependencies: [core]
    agents: [flutter-expert]
    skills: [dart-flutter-patterns]

  - name: devops
    version: 1.0.1
    category: development
    description: Delivery and operations, with the devops, incident, observability and release subagents and the deployment, Docker and Ansible skills.
    dependencies: [core]
    agents: [devops-automator, devops-troubleshooter, error-detective, observability-engineer, release-manager]
    skills: [deployment-patterns, docker-patterns, ansible]

  - name: review-and-security
    version: 1.1.1
    category: development
    description: Code review, security audit, codebase mapping and legacy migration, with four subagents and the review, review comment and duplication skills.
    dependencies: [core]
    agents: [code-reviewer, security-auditor, code-archaeologist, legacy-modernizer]
    skills: [code-reviewer, review-comments, review-duplication]

  - name: testing
    version: 1.0.1
    category: development
    description: Tests, debugging, performance measurement and the quality loop, with five subagents and the regression, end-to-end, Playwright and quality-loop skills. The quality-loop skill carries Robert C. Martin's crapper, dryer and mutator (github.com/unclebob), copied into a project that lacks them.
    dependencies: [core]
    agents: [test-automator, debugger, e2e-runner, performance-engineer, quality-loop]
    skills: [ai-regression-testing, e2e-runbooks, e2e-testing, quality-loop]

  - name: docs-and-product
    version: 1.0.1
    category: development
    description: Documentation, legal drafts, SEO and project tracking, with four subagents and the SEO, tracking and Jira skills.
    dependencies: [core]
    agents: [docs-architect, legal-advisor, seo-content-marketer, project-manager]
    skills: [seo, project-tracking, jira-integration]

  - name: embedded
    version: 1.0.1
    category: development
    description: Embedded C and hardware, with the embedded-c-engineer subagent and the Arduino, KiCad and 3D printing skills.
    dependencies: [core]
    agents: [embedded-c-engineer]
    skills: [embedded-c-arduino, kicad, g-code-3d-printing]

  - name: game
    version: 1.0.1
    category: development
    description: Unity games, with the unity-game-dev subagent and the Unity skill.
    dependencies: [core]
    agents: [unity-game-dev]
    skills: [unity]

  - name: agent-tooling
    version: 1.0.1
    category: development
    description: Agent configuration and research, with the agent-engineer subagent and the agentic engineering, research and automation inventory skills.
    dependencies: [core]
    agents: [agent-engineer]
    skills: [agentic-engineering, research, automation-inventory]

  - name: linux
    version: 1.0.1
    category: host
    description: Linux desktop administration on Arch, CachyOS and KDE Plasma.
    skills: [arch-linux, cachyos, kde-plasma]

  - name: windows-and-mac
    version: 1.0.1
    category: host
    description: Windows and macOS administration and PowerShell scripting.
    skills: [windows, macos, powershell]

  - name: homelab
    version: 1.0.1
    category: host
    description: Homelab hosts and services, with the home-assistant-engineer subagent and the Proxmox, router, Syncthing, Samsung TV, WLED and machine health skills.
    dependencies: [core]
    agents: [home-assistant-engineer]
    skills: [home-assistant, proxmox, homelab-services, asus-router, syncthing, samsung-tv, wled, machine-health]

  - name: personal-tools
    version: 1.0.1
    category: host
    description: Obsidian, JetBrains IDE configuration and the self-hosted AscendMemory, ascend-web-hunter and AudioScribe services.
    skills: [obsidian, jetbrains-ide-ops, ascend-memory, ascend-web-hunter, audio-scribe]

  - name: mcp-all
    version: 1.0.1
    category: bundle
    description: Every MCP server plugin in one install.
    dependencies:
      - mcp-context7
      - mcp-mongodb
      - mcp-grafana
      - mcp-playwright
      - mcp-chrome-devtools
      - mcp-redis
      - mcp-sonarqube
      - mcp-n8n
      - mcp-home-assistant

  - name: all
    version: 1.0.1
    category: bundle
    description: Core and every development domain in one install. Host groups and MCP servers stay separate installs.
    dependencies:
      - core
      - python
      - jvm
      - go
      - backend
      - data
      - web-frontend
      - mobile
      - devops
      - review-and-security
      - testing
      - docs-and-product
      - embedded
      - game
      - agent-tooling

  - name: hooks-all
    version: 1.0.1
    category: bundle
    description: Every Claude Code hook plugin in one install.
    dependencies:
      - hook-preflight-gate
      - hook-task-list-sync
      - hook-no-ai-markers-check
      - hook-markdown-lint-check
      - hook-standards-advisory-check
      - hook-preflight-reminder
      - hook-background-subagent-reminder
      - hook-subagent-reminder
