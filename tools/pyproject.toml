[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-standards-tools"
version = "0.1.0"
description = "Generator for agent-standards subagent distribution"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

[project.scripts]
gen_subagents = "gen_subagents:main"

[tool.setuptools]
py-modules = ["gen_subagents", "gen_plugins", "check_versions", "git_http", "plugin_tags"]

[tool.setuptools.package-dir]
"" = "."

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 120
addopts = [
    "--strict-markers",
    "--strict-config",
]
# pytest's own defaults, plus the quality loop's sample projects, whose tests only their CI job runs.
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "quality_samples"]
