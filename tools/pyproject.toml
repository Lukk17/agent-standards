[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-standards-tools"
version = "0.1.0"
description = "Generator for agent-standards subagent distribution"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
gen_subagents = "gen_subagents:main"

[tool.setuptools]
py-modules = ["gen_subagents"]

[tool.setuptools.package-dir]
"" = "."

[tool.uv]
package = false
