[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-standards-tools"
version = "0.1.0"
description = "Generator for agent-standards subagent distribution"
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[project.scripts]
gen_subagents = "gen_subagents:main"

[tool.setuptools]
py-modules = ["gen_subagents"]

[tool.setuptools.package-dir]
"" = "."

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
